<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调查问卷配置工具</title>
<style>
  :root {
    --border: #d9dde3;
    --bg-soft: #f6f7f9;
    --primary: #2f6fed;
    --primary-dark: #1f4fb8;
    --iv-color: #2f6fed;
    --dv-color: #e0572c;
    --text-light: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f5;
    color: #1f2328;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--text-light); font-size: 13px; }

  .layout {
    display: flex;
    gap: 16px;
    padding: 16px;
    align-items: flex-start;
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .col-left { flex: 0 0 420px; display: flex; flex-direction: column; gap: 16px; }
  .col-right { flex: 1; min-width: 0; }

  .file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type="file"] { font-size: 13px; }
  .status { font-size: 12px; color: var(--text-light); }
  .status.error { color: #c0392b; }
  .status.ok { color: #1f8f4c; }

  .title-field { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .title-field label { font-size: 12px; color: var(--text-light); }
  .title-field input {
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
  }

  h2.section-title {
    font-size: 15px;
    margin: 0 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .var-group { margin-bottom: 18px; }
  .var-group:last-child { margin-bottom: 0; }
  .var-group-title {
    font-size: 13px; font-weight: 600; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.iv { background: var(--iv-color); }
  .dot.dv { background: var(--dv-color); }

  .var-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .var-card label.var-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .var-config { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: none; }
  .var-config.show { display: block; }
  .method-type { display: flex; gap: 16px; margin-bottom: 8px; font-size: 13px; }
  .method-type label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .option-select {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; background: #fff;
  }
  .no-option { font-size: 12px; color: var(--text-light); font-style: italic; }

  .preview-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary {
    background: #fff; color: var(--primary);
  }
  button.secondary:hover { background: var(--bg-soft); }

  #previewContent { font-size: 14px; line-height: 1.7; }
  #previewContent h2.q-title { font-size: 18px; margin: 0 0 4px; }
  #previewContent .q-meta { color: var(--text-light); font-size: 12px; margin-bottom: 16px; }
  .preview-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .preview-card h3 { margin: 0 0 8px; font-size: 15px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    font-weight: 400;
    vertical-align: middle;
  }
  .tag.iv { background: rgba(47,111,237,0.12); color: var(--iv-color); }
  .tag.dv { background: rgba(224,87,44,0.12); color: var(--dv-color); }
  .tag.method { background: #eef1f5; color: #444; }
  .preview-card p { margin: 6px 0; }
  .preview-card ol { margin: 6px 0 6px 20px; padding: 0; }
  .empty-hint { color: var(--text-light); font-size: 13px; padding: 20px 0; text-align: center; }

  @media print {
    header, .col-left, .preview-toolbar { display: none !important; }
    .layout { padding: 0; }
    .col-right { flex: 1; }
    .panel { border: none; }
  }
</style>
</head>
<body>

<header>
  <h1>动态调查问卷配置工具</h1>
  <p>加载变量数据 → 为每个变量选择测量方式（量表测量 / 行为测量）→ 实时组合生成问卷预览</p>
</header>

<div class="layout">
  <div class="col-left">

    <div class="panel">
      <h2 class="section-title">1. 加载数据</h2>
      <div class="file-row">
        <input type="file" id="fileInput" accept="application/json,.json">
      </div>
      <div id="loadStatus" class="status">请选择一个按模板填写好的 JSON 文件（如 data-template.json）</div>

      <div class="title-field">
        <label for="qTitle">问卷标题（显示在预览/生成结果顶部）</label>
        <input type="text" id="qTitle" placeholder="例如：XX研究正式问卷">
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">2. 选择变量与测量方式</h2>
      <div class="var-group">
        <div class="var-group-title"><span class="dot iv"></span>自变量</div>
        <div id="ivContainer"><div class="no-option">尚未加载数据</div></div>
      </div>
      <div class="var-group">
        <div class="var-group-title"><span class="dot dv"></span>因变量</div>
        <div id="dvContainer"><div class="no-option">尚未加载数据</div></div>
      </div>
    </div>

  </div>

  <div class="col-right">
    <div class="panel">
      <h2 class="section-title">3. 问卷预览 / 生成结果</h2>
      <div class="preview-toolbar">
        <button id="printBtn">打印 / 导出PDF</button>
        <button class="secondary" id="copyBtn">复制为文本</button>
      </div>
      <div id="previewContent">
        <div class="empty-hint">加载数据并勾选变量后，这里会实时显示生成的问卷内容</div>
      </div>
    </div>
  </div>
</div>

<textarea id="copyHelper" style="position:absolute; left:-9999px; top:-9999px;"></textarea>

<script>
(function () {
  // 内置数据（与同目录 data-template.json 内容一致，内容整理自 credamo.md），页面打开时自动加载，

              "researchContent": "中文题名《通过消费保护自我：地位商品作为自我肯定的资源》。研究内容：人在受到自我威胁时，会出更高价购买地位商品，以此修复自我价值；若给了别的自我修复途径，这种溢价就消失（研究 1–3 均为“描述商品地位 → 问愿付多少”）。",
              "procedure": [
                "第 1 步（研究 1，照片）：材料是一张专业摄影照片，高地位版描述为“rare, unique, and available for a limited time”（稀有、独特、限时），无地位版为“common, mass-produced, and widely available”（常见、量产、到处买得到）；问题为“the maximum dollar value they would spend to acquire the photograph”（最多愿意花多少美元买下它）；因变量 = 美元金额。",
                "第 2 步（研究 2，手表）：材料是文字描述，“只被极少数人拥有” vs “很常见、很多人戴”；问题为“the maximum percentage of the retail price they would be willing to pay… from 1 (10%) to 12 (120%)”（最多愿付零售价的百分之多少，1 = 10% … 12 = 120%）；因变量 = 1–12 档。",
                "第 3 步（研究 3，汽车，网络问卷）：材料是一段“豪华运动轿车”的新车介绍（优雅质感、奢华驾乘、高端性能）；问题为“What is the maximum dollar amount you would be willing to pay to purchase this car?”（最多愿意花多少钱买这辆车），另附地位感知（1–9）与豪车知识（1–9）校验题；因变量 = 美元金额。",
                "第 4 步（因变量口径）：以被试报出的最高愿付价（金额或零售价百分比档位）作为炫耀性/地位消费的强度指标，愿付价越高表示越愿为地位支付溢价。"
              ]
            },
            {
              "id": "dv_cc_charles_2009_visible",
              "reference": "Charles, K. K., Hurst, E., & Roussanov, N. (2009). Conspicuous consumption and race. The Quarterly Journal of Economics, 124(2), 425–467. https://doi.org/10.1162/qjec.2009.124.2.425",
              "researchContent": "中文题名《炫耀性消费与种族》。测量思路：不使用量表，而用真实消费支出测量炫耀性消费，将炫耀性消费操作化为“可见性消费”（visible consumption），即在匿名社会互动中容易被他人看到、且能跨场景携带的支出。属于二手档案数据测量，不需要被试进入实验。",
              "procedure": [
                "第 1 步（定品类）：对 320 名大学生做匿名在线预调查，询问“你需要与某人多近距离的接触，才能判断他在这类支出上的花费是否高于平均水平？”，据此选出最容易观察的类别——服装/珠宝、个人护理、汽车（不含维修保养）。住房也被判定为可见，但因可能混入住房市场歧视，主结果中排除。",
                "第 2 步（取数据）：使用 1986–2002 年美国消费者支出调查（CEX），把 47 个原始支出类合并为 15 类，最终样本 49,363 户。",
                "第 3 步（算指标）：三类可见性支出加总 ÷ 该户参与调查的季度数 = 每季度平均可见性支出，取对数作因变量。对应原始类别——服装/珠宝：服装与鞋（029）、服装服务（030）、珠宝与手表（031）；个人护理：盥洗用品与化妆品（032）、理发店/美容院/健身俱乐部（033）；汽车：新车与二手车净支出（052）（主口径，扩展口径另含维修、车贷本金等）。",
                "第 4 步（跑回归）：ln(可见性支出) 对种族虚拟变量回归；以 ln(总支出) 代理永久收入并用收入变量工具变量化，控制人口学变量与年份固定效应；再加入“同州 × 同种族”的平均收入（CPS 估计的成年男性劳动收入）作为参照群体变量，并做证伪检验（他群体收入、非可见性支出应无效应）。",
                "关键结果：可见性支出约占总支出 12%；控制永久收入后黑人 +26%、西语裔 +23%（约 $1,900/年）；对总支出弹性 1.5（属奢侈品）；本州同族平均收入翻倍时，可见性支出下降约 60%。",
                "两点注意：① 该测量是单一客观支出指标，无题项、不报告 Cronbach's α；② 品类清单具时代与文化依赖，不能直接套用于中国样本，需重做可见性预调查。"
              ]
            }
          ]
        }
      }
    ]
  };

  let data = { variables: [] };
  // selection[varId] = { included: bool, methodType: 'scale'|'behavioral', optionId: string }
  const selection = {};

  const fileInput = document.getElementById('fileInput');
  const loadStatus = document.getElementById('loadStatus');
  const ivContainer = document.getElementById('ivContainer');
  const dvContainer = document.getElementById('dvContainer');
  const previewContent = document.getElementById('previewContent');
  const qTitle = document.getElementById('qTitle');

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function truncate(str, n) {
    str = String(str || '');
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  fileInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (evt) {
      try {
        const parsed = JSON.parse(evt.target.result);
        if (!parsed || !Array.isArray(parsed.variables)) {
          throw new Error('JSON 缺少顶层 variables 数组');
        }
        data = parsed;
        Object.keys(selection).forEach(k => delete selection[k]);
        loadStatus.textContent = '已加载：' + file.name + '（共 ' + data.variables.length + ' 个变量）';
        loadStatus.className = 'status ok';
        renderVariables();
        updatePreview();
      } catch (err) {
        loadStatus.textContent = '加载失败：' + err.message;
        loadStatus.className = 'status error';
      }
    };
    reader.readAsText(file, 'utf-8');
  });

  qTitle.addEventListener('input', updatePreview);

  function renderVariables() {
    const ivVars = data.variables.filter(v => v.type === 'independent');
    const dvVars = data.variables.filter(v => v.type === 'dependent');
    ivContainer.innerHTML = ivVars.length ? '' : '<div class="no-option">数据中没有自变量</div>';
    dvContainer.innerHTML = dvVars.length ? '' : '<div class="no-option">数据中没有因变量</div>';
    ivVars.forEach(v => ivContainer.appendChild(buildVarCard(v)));
    dvVars.forEach(v => dvContainer.appendChild(buildVarCard(v)));
  }

  function buildVarCard(variable) {
    const card = document.createElement('div');
    card.className = 'var-card';
    card.dataset.id = variable.id;

    const toggleLabel = document.createElement('label');
    toggleLabel.className = 'var-toggle';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = variable.name;
    toggleLabel.appendChild(checkbox);
    toggleLabel.appendChild(nameSpan);
    card.appendChild(toggleLabel);

    const config = document.createElement('div');
    config.className = 'var-config';

    const hasScale = (variable.measurements && variable.measurements.scale || []).length > 0;
    const hasBehavioral = (variable.measurements && variable.measurements.behavioral || []).length > 0;

    const methodRow = document.createElement('div');
    methodRow.className = 'method-type';

    if (hasScale) {
      const scaleLabel = document.createElement('label');
      scaleLabel.innerHTML = '<input type="radio" name="method-' + variable.id + '" value="scale"> 量表测量';
      methodRow.appendChild(scaleLabel);
    }
    if (hasBehavioral) {
      const behLabel = document.createElement('label');
      behLabel.innerHTML = '<input type="radio" name="method-' + variable.id + '" value="behavioral"> 行为测量';
      methodRow.appendChild(behLabel);
    }
    if (!hasScale && !hasBehavioral) {
      const none = document.createElement('div');
      none.className = 'no-option';
      none.textContent = '该变量没有可用的测量方式数据';
      methodRow.appendChild(none);
    }
    config.appendChild(methodRow);

    const select = document.createElement('select');
    select.className = 'option-select';
    config.appendChild(select);

    card.appendChild(config);

    checkbox.addEventListener('change', function () {
      if (!selection[variable.id]) selection[variable.id] = {};
      selection[variable.id].included = checkbox.checked;
      config.classList.toggle('show', checkbox.checked);
      if (checkbox.checked && !selection[variable.id].methodType) {
        const defaultType = hasScale ? 'scale' : (hasBehavioral ? 'behavioral' : null);
        if (defaultType) {
          const radio = methodRow.querySelector('input[value="' + defaultType + '"]');
          if (radio) radio.checked = true;
          selection[variable.id].methodType = defaultType;
          populateOptions(variable, defaultType, select);
        }
      }
      updatePreview();
    });

    methodRow.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', function () {
        selection[variable.id].methodType = radio.value;
        populateOptions(variable, radio.value, select);
        updatePreview();
      });
    });

    select.addEventListener('change', function () {
      selection[variable.id].optionId = select.value;
      updatePreview();
    });

    return card;
  }

  function populateOptions(variable, methodType, select) {
    const list = (variable.measurements && variable.measurements[methodType]) || [];
    select.innerHTML = '';
    if (!list.length) {
      const opt = document.createElement('option');
      opt.textContent = '（无可用选项）';
      select.appendChild(opt);
      selection[variable.id].optionId = null;
      return;
    }
    list.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = truncate(item.reference, 70);
      select.appendChild(opt);
    });
    selection[variable.id].optionId = list[0].id;
    select.value = list[0].id;
  }

  function findVariable(varId) {
    return data.variables.find(v => v.id === varId);
  }

  function findOption(variable, methodType, optionId) {
    const list = (variable.measurements && variable.measurements[methodType]) || [];
    return list.find(o => o.id === optionId);
  }

  function updatePreview() {
    const included = Object.keys(selection).filter(id => selection[id] && selection[id].included);
    if (!included.length) {
      previewContent.innerHTML = '<div class="empty-hint">加载数据并勾选变量后，这里会实时显示生成的问卷内容</div>';
      return;
    }

    let html = '';
    const title = qTitle.value.trim();
    html += '<h2 class="q-title">' + escapeHtml(title || '（未命名问卷）') + '</h2>';
    html += '<div class="q-meta">共包含 ' + included.length + ' 个变量 · 生成时间 ' + escapeHtml(new Date().toLocaleString()) + '</div>';

    included.forEach(varId => {
      const sel = selection[varId];
      const variable = findVariable(varId);
      if (!variable || !sel.methodType || !sel.optionId) return;
      const option = findOption(variable, sel.methodType, sel.optionId);
      if (!option) return;

      const typeTagClass = variable.type === 'independent' ? 'iv' : 'dv';
      const typeTagText = variable.type === 'independent' ? '自变量' : '因变量';
      const methodTagText = sel.methodType === 'scale' ? '量表测量' : '行为测量';

      html += '<div class="preview-card">';
      html += '<h3>' + escapeHtml(variable.name) +
              '<span class="tag ' + typeTagClass + '">' + typeTagText + '</span>' +
              '<span class="tag method">' + methodTagText + '</span></h3>';
      html += '<p><strong>参考文献：</strong>' + escapeHtml(option.reference) + '</p>';
      html += '<p><strong>研究内容：</strong>' + escapeHtml(option.researchContent) + '</p>';

      if (sel.methodType === 'scale') {
        html += '<p><strong>测量题项：</strong></p><ol>';
        (option.items || []).forEach(item => { html += '<li>' + escapeHtml(item) + '</li>'; });
        html += '</ol>';
        html += '<p><strong>计分方式：</strong>' + escapeHtml(option.scoring) + '</p>';
        html += '<p><strong>信度报告：</strong>' + escapeHtml(option.reliability || '无') + '</p>';
      } else {
        html += '<p><strong>实验流程（被试视角）：</strong></p><ol>';
        (option.procedure || []).forEach(step => { html += '<li>' + escapeHtml(step) + '</li>'; });
        html += '</ol>';
      }
      html += '</div>';
    });

    previewContent.innerHTML = html;
  }

  function buildPlainText() {
    const included = Object.keys(selection).filter(id => selection[id] && selection[id].included);
    const title = qTitle.value.trim() || '（未命名问卷）';
    let lines = [title, ''];
    included.forEach(varId => {
      const sel = selection[varId];
      const variable = findVariable(varId);
      if (!variable || !sel.methodType || !sel.optionId) return;
      const option = findOption(variable, sel.methodType, sel.optionId);
      if (!option) return;

      const typeTagText = variable.type === 'independent' ? '自变量' : '因变量';
      const methodTagText = sel.methodType === 'scale' ? '量表测量' : '行为测量';

      lines.push('【' + variable.name + '】（' + typeTagText + ' / ' + methodTagText + '）');
      lines.push('参考文献：' + option.reference);
      lines.push('研究内容：' + option.researchContent);
      if (sel.methodType === 'scale') {
        lines.push('测量题项：');
        (option.items || []).forEach((item, i) => lines.push('  ' + (i + 1) + '. ' + item));
        lines.push('计分方式：' + option.scoring);
        lines.push('信度报告：' + (option.reliability || '无'));
      } else {
        lines.push('实验流程（被试视角）：');
        (option.procedure || []).forEach((step, i) => lines.push('  ' + (i + 1) + '. ' + step));
      }
      lines.push('');
    });
    return lines.join('\n');
  }

  document.getElementById('printBtn').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    const text = buildPlainText();
    const helper = document.getElementById('copyHelper');
    helper.value = text;
    helper.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
    }
    alert(ok || (navigator.clipboard) ? '已复制到剪贴板' : '复制失败，请手动选中预览内容复制');
  });

  function init() {
    data = DEFAULT_DATA;
    loadStatus.textContent = '已自动加载内置数据（共 ' + data.variables.length + ' 个变量）。要换成你自己的数据，请用上方“选择文件”加载填好的 JSON。';
    loadStatus.className = 'status ok';
    renderVariables();
    updatePreview();
  }
  init();
})();
</script>

</body>
</html>
